name: Build and Test API

on:
  push:
    branches: [ "Part2-API", "main" ]
  pull_request:
    branches: [ "Part2-API", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore API
      run: dotnet restore RaceDayAPI/RaceDayAPI.csproj
      
    - name: Restore Tests
      run: dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj
      
    - name: Build
      run: dotnet build RaceDayAPI/RaceDayAPI.csproj --no-restore
      
    - name: Test
      run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-build --verbosity normal