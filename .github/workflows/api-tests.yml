name: .NET Core CI

on:
  push:
    branches: [ "main", "master", "Part3-MVC" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies API
      run: dotnet restore "PROG6212 2B/RaceDayAPI/RaceDayAPI/RaceDayAPI.csproj"
      
    - name: Build API
      run: dotnet build "PROG6212 2B/RaceDayAPI/RaceDayAPI/RaceDayAPI.csproj" --no-restore
      
    - name: Test API
      run: dotnet test "PROG6212 2B/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj" --no-restore
      
    - name: Restore dependencies MVC
      run: dotnet restore "PROG6212 2B/RaceDayAPI/RaceDayMVC/RaceDayMVC.csproj"
      
    - name: Build MVC
      run: dotnet build "PROG6212 2B/RaceDayAPI/RaceDayMVC/RaceDayMVC.csproj" --no-restore
