name: .NET Core CI

on:
  push:
    branches: [ "main", "master", "Part3-MVC" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies API
      run: dotnet restore "RaceDayAPI/RaceDayAPI/RaceDayAPI.csproj"
      
    - name: Build API
      run: dotnet build "RaceDayAPI/RaceDayAPI/RaceDayAPI.csproj" --no-restore
      
    # Notice we removed --no-restore from the test command
    - name: Test API
      run: dotnet test "RaceDayAPI.Tests/RaceDayAPI.Tests.csproj"
      
    - name: Restore dependencies MVC
      run: dotnet restore "RaceDayAPI/RaceDayMVC/RaceDayMVC.csproj"
      
    - name: Build MVC
      run: dotnet build "RaceDayAPI/RaceDayMVC/RaceDayMVC.csproj" --no-restore
